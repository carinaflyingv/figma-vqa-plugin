<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #071e45; --soft: #3d5a87; --rule: #c6d0e3;
    --surface: #e7ecf2; --alt: #f2f6fb; --brand: #5f3491; --flag: #ff006e;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; padding: 16px;
    font: 12px/1.5 Inter, -apple-system, system-ui, sans-serif;
    color: var(--ink); background: #fff;
  }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--soft); font-size: 11px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .slot {
    flex: 1; padding: 8px 10px; border: 1px solid var(--rule);
    border-radius: 8px; background: var(--alt); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot.empty { color: var(--soft); font-style: italic; }
  .slot b { font-weight: 600; }
  label.opt { display: flex; justify-content: space-between; align-items: center;
              font-size: 11px; color: var(--soft); margin: 6px 0; }
  input[type=range] { width: 160px; }
  input[type=text] {
    font: inherit; font-size: 11px; padding: 5px 7px; border-radius: 6px;
    border: 1px solid var(--rule); background: #fff; color: var(--ink);
  }
  select, input[type=number] {
    font: inherit; font-size: 11px; padding: 4px 6px; border-radius: 6px;
    border: 1px solid var(--rule); background: #fff; color: var(--ink);
    max-width: 250px;
  }
  button {
    width: 100%; padding: 11px; border: 0; border-radius: 9px;
    background: var(--brand); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; margin-top: 10px;
  }
  button:disabled { background: var(--rule); color: var(--soft); cursor: default; }
  button.ghost { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  #log { margin-top: 14px; font-size: 11px; }
  .note { color: var(--soft); margin-bottom: 4px; }
  .bad { color: var(--flag); font-weight: 600; }
  .card {
    border: 1px solid var(--rule); border-radius: 9px; padding: 10px 12px;
    margin-bottom: 8px;
  }
  .card .h { font-weight: 600; font-size: 12px; }
  .card .m { color: var(--soft); font-size: 10px; text-transform: uppercase;
             letter-spacing: 0.04em; margin: 2px 0 6px; }
  .kv { display: flex; gap: 8px; font-size: 11px; }
  .kv span:first-child { color: var(--soft); width: 62px; flex: none; }
  .kv.obs span:last-child { color: var(--flag); font-weight: 600; }
  .ev { color: var(--soft); font-size: 10px; margin-top: 5px; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 14px 0; }
  .card.major { border-left: 3px solid var(--flag); }
  .card.minor { border-left: 3px solid #d99b00; }
  .card.info  { border-left: 3px solid var(--rule); }
  .rule { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em;
          color: var(--soft); margin-bottom: 3px; }
  .fix { font-size: 10px; color: var(--brand); margin-top: 6px; }
  .clean { text-align: center; padding: 24px 12px; color: var(--soft); }
  .clean b { display: block; font-size: 22px; color: var(--brand); margin-bottom: 4px; }
  .info {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; margin-left: 5px; border-radius: 50%;
    border: 1px solid var(--rule); color: var(--soft);
    font-size: 9px; font-weight: 600; cursor: help; position: relative;
    vertical-align: middle;
  }
  .info:hover { border-color: var(--brand); color: var(--brand); }
  /* Pinned to the panel itself, not to the icon or its row. Anchoring to
     anything inside the layout means the tooltip can always find an edge to run
     off: beside a 14px icon it overflows sideways, below a row near the bottom it
     overflows down. Fixed to the panel's own bounds, there is no edge left. */
  .info .tip {
    display: none; position: fixed; left: 12px; right: 12px; bottom: 12px;
    z-index: 50; padding: 12px 14px; border-radius: 10px;
    background: var(--ink); color: #fff; font-size: 11px; font-weight: 400;
    line-height: 1.55; text-align: left; letter-spacing: 0; cursor: default;
    box-shadow: 0 10px 30px rgba(7,30,69,0.35); white-space: normal;
    max-height: 70vh; overflow-y: auto;
  }
  .info:hover .tip, .info:focus .tip { display: block; }
  .info .tip b { color: #fff; }
  .tip em { font-style: normal; color: #b9c6dd; }
  .sub { position: relative; }
  canvas { display: none; }
</style>
</head>
<body>

<h1>Prisme VQA <span style="font-weight:400; font-size:10px; color:var(--soft)">v41</span></h1>

<div class="sub">Select a pasted screenshot and the component variant it should
match. Compares the rendered result against the design and reports what differs, in
numbers.</div>

<div class="row"><div class="slot empty" id="slotShot">no screenshot selected</div></div>
<div class="row"><div class="slot empty" id="slotComp">no component selected</div></div>

<label class="opt" style="align-items:flex-start">
  <span>Resolved font
    <span class="info" tabindex="0">i<span class="tip">
    What the <b>app</b> actually rendered with, not what it asked for. Read it off
    the debug footer, or paste it.<br><br>
    Compared against the typeface on the Figma component. This is the only way to
    catch <b>font fallback</b>: the app requests Wells Fargo Sans, that font did
    not ship in the build, the system quietly substitutes San Francisco, and the
    button looks completely fine. No pixel measurement can see that. A string
    comparison catches it the first time it renders.<br><br>
    Accepts anything readable: <em>Wells Fargo Sans SemiBold 17/24</em>,
    <em>WellsFargoSans-SemiBold 17pt</em>, or just the family name.
    </span></span>
  </span>
  <input type="text" id="font" placeholder="e.g. Wells Fargo Sans SemiBold 17"
         style="width:230px">
</label>

<label class="opt">
  <span>Device</span>
  <select id="dev">
    <option value="auto">Auto detect</option>
    <option value="375x667x2">iPhone SE / 8 &middot; 375x667 @2x</option>
    <option value="390x844x3">iPhone 12 / 13 / 14 &middot; 390x844 @3x</option>
    <option value="393x852x3">iPhone 15 / 16 Pro &middot; 393x852 @3x</option>
    <option value="430x932x3">iPhone 15 / 16 Pro Max &middot; 430x932 @3x</option>
    <option value="412x915x2.625">Pixel 8 / 7 &middot; 412x915 @2.625x</option>
    <option value="360x780x3">Galaxy S24 &middot; 360x780 @3x</option>
    <option value="744x1133x2">iPad mini &middot; 744x1133 @2x</option>
    <option value="custom">Custom scale…</option>
    <option value="responsive">Responsive web…</option>
  </select>
</label>
<label class="opt" id="bpRow" style="display:none">
  <span>Breakpoint
    <span class="info" tabindex="0">i<span class="tip">
    Which width the capture was taken at. Auto detect cannot work on the web,
    since a browser window can be any width, so this has to be told.<br><br>
    It has to match the Figma frame you are comparing against. Compare a 1024
    capture against a 390 design and every finding will be about the breakpoint
    rather than the build.<br><br>
    <b>Scale</b> is 1 for an ordinary screenshot, 2 on a retina display.
    </span></span>
  </span>
  <span style="display:flex; gap:6px">
    <select id="bp">
      <option value="320-767" selected>Small – Medium &middot; 320–767px</option>
      <option value="768-9999">Large – X_Large &middot; 768px and up</option>
      <option value="custom">custom range&hellip;</option>
    </select>
    <input type="number" id="bpMin" min="240" max="3840" step="1" value="320"
           style="width:58px; display:none" placeholder="min">
    <input type="number" id="bpMax" min="240" max="9999" step="1" value="767"
           style="width:58px; display:none" placeholder="max">
        <select id="bpScale" style="width:64px">
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
    </select>
  </span>
</label>

<label class="opt" id="dprRow" style="display:none">
  <span>Scale factor</span>
  <input type="number" id="dpr" min="0.5" max="6" step="0.05" value="3" style="width:70px">
</label>
<button id="resize" class="ghost">Resize screenshot to logical points</button>

<label class="opt">
  <span>Threshold <b id="thVal">12</b><span class="info" tabindex="0">i<span class="tip">How different two pixels must be before they count as different. Summed across red, green and blue, so the scale is <b>0 to 765</b>. At 12 a pixel has to be off by about 4 per channel.<br><br><em>Lower</em> catches more, and picks up rendering noise. <em>Higher</em> only catches obvious differences and will miss a hardcoded hex, which is the whole point of the low delta signature.<br><br>Tune it with a control capture: run one you believe is correct, see what it reports, set the threshold just above that.</span></span></span>
  <input type="range" id="th" min="4" max="60" value="12">
</label>
<label class="opt">
  <span>Cluster merge <b id="dlVal">2</b><span class="info" tabindex="0">i<span class="tip">How aggressively neighboring differing pixels are grouped into one finding.<br><br><em>1</em> reports many small clusters, so a shifted label becomes forty glyph fragments. <em>2</em> merges them into readable regions. <em>3 to 4</em> start merging unrelated things, so a padding change and a label shift become one blob.<br><br>Leave it at 2 unless several geometry defects sit on the same element and you need them separated.</span></span></span>
  <input type="range" id="dl" min="1" max="4" value="2">
</label>
<label class="opt">
  <span>Color floor <b id="cfVal">0.25%</b><span class="info" tabindex="0">i<span class="tip">The smallest share of the element a color must cover before the palette sweep reports on it.<br><br>At <b>0.10%</b> a 1pt divider registers. Below about 0.05% the antialiased blends along every edge start appearing as colors of their own, which is noise rather than signal.<br><br>Raise it if small details are creating chatter, lower it if something real is being missed.</span></span></span>
  <input type="range" id="cf" min="2" max="200" value="25">
</label>

<button id="run" disabled>Compare</button>

<div id="groupRow" style="display:none">
  <label class="opt" style="align-items:flex-start">
    <span>Annotate
      <span class="info" tabindex="0">i<span class="tip">
      Which findings to draw on the canvas. Every finding stays in the list below
      whatever you pick here.<br><br>
      <b>Separate board per group</b> lays out one copy of the screenshot for each
      kind of finding, so spacing, type and color each get a clean board instead of
      eight arrows converging on one small component.
      </span></span>
    </span>
    <select id="groupSel"></select>
  </label>
</div>
<button id="draw" class="ghost" style="display:none">Annotate in Figma</button>
<button id="renum" class="ghost">Renumber &amp; clean up deleted cards
  <span class="info" tabindex="0" style="border-color:transparent">i<span class="tip">
  Delete the finding cards you do not want, then run this.<br><br>
  The remaining cards renumber from 1, and every marker, arrow and dimension
  belonging to a deleted card is <b>removed from the canvas</b>.<br><br>
  A plugin cannot watch the document for deletions, so this has to be a button
  rather than something automatic.
  </span></span>
</button>
<div id="log"></div>


</div>
<canvas id="cA"></canvas>
<canvas id="cB"></canvas>

<script>
const $ = id => document.getElementById(id);
let lastPayload = null;

$("th").oninput = e => { $("thVal").textContent = e.target.value; save(); };
$("dl").oninput = e => { $("dlVal").textContent = e.target.value; save(); };
$("cf").oninput = e => { $("cfVal").textContent = (e.target.value / 100).toFixed(2) + "%"; save(); };

function log(html) { $("log").innerHTML = html; }

// ------------------------------------------------------------------ decoding
async function decode(bytes) {
  const blob = new Blob([new Uint8Array(bytes)], { type: "image/png" });
  const url = URL.createObjectURL(blob);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("could not decode PNG"));
    i.src = url;
  });
  URL.revokeObjectURL(url);
  return img;
}

function toData(img, canvas) {
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.clearRect(0, 0, img.width, img.height);
  ctx.drawImage(img, 0, 0);
  return ctx.getImageData(0, 0, img.width, img.height);
}

// Composite onto white. A Figma node export is transparent outside its corner
// radius, and leaving that as zeroed RGB makes the corners read as black, which
// then reports as four large false findings on every run.
function flatten(d, bg) {
  const o = new Uint8ClampedArray(d.data.length);
  for (let i = 0; i < d.data.length; i += 4) {
    const a = d.data[i + 3] / 255;
    o[i]     = d.data[i]     * a + bg[0] * (1 - a);
    o[i + 1] = d.data[i + 1] * a + bg[1] * (1 - a);
    o[i + 2] = d.data[i + 2] * a + bg[2] * (1 - a);
    o[i + 3] = 255;
  }
  return { data: o, width: d.width, height: d.height };
}

// Grow the canonical onto a larger field of the capture's background color, so a
// element that changed size has room to differ rather than being cropped away.
function padded(d, m, bg) {
  const w = d.width + m * 2, h = d.height + m * 2;
  const out = new Uint8ClampedArray(w * h * 4);
  for (let i = 0; i < w * h; i++) {
    out[i*4] = bg[0]; out[i*4+1] = bg[1]; out[i*4+2] = bg[2]; out[i*4+3] = 255;
  }
  for (let y = 0; y < d.height; y++) {
    for (let x = 0; x < d.width; x++) {
      const si = (y * d.width + x) * 4, di = ((y + m) * w + (x + m)) * 4;
      out[di] = d.data[si]; out[di+1] = d.data[si+1];
      out[di+2] = d.data[si+2]; out[di+3] = 255;
    }
  }
  return { data: out, width: w, height: h };
}

function hexRgb(h) {
  h = h.replace("#", "");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

// ------------------------------------------------------------------ locating
// Find the component inside the screenshot by its fill color. This is what makes
// the plugin work without asking the user to draw a crop box, and it doubles as
// the identity check: if the thing found is a different size to the canonical,
// these are not the same component and no finding below can be trusted.
function locate(d, rgb, tol, expect) {
  // Take connected regions, not the bounding box of every matching pixel. The
  // component's fill color also appears in text and icons elsewhere on screen,
  // and a global bounding box then spans most of the screenshot. When an expected
  // size is known, pick the region closest to it rather than merely the biggest.
  const w = d.width, h = d.height;
  const hit = new Uint8Array(w * h);
  for (let i = 0, k = 0; k < w * h; k++, i += 4) {
    const s = Math.abs(d.data[i]-rgb[0]) + Math.abs(d.data[i+1]-rgb[1]) + Math.abs(d.data[i+2]-rgb[2]);
    if (s < tol) hit[k] = 1;
  }

  const seen = new Uint8Array(w * h);
  const stack = new Int32Array(w * h);
  const regions = [];
  for (let s0 = 0; s0 < w * h; s0++) {
    if (!hit[s0] || seen[s0]) continue;
    let sp = 0; stack[sp++] = s0; seen[s0] = 1;
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, area = 0;
    while (sp > 0) {
      const k = stack[--sp];
      const x = k % w, y = (k / w) | 0;
      area++;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const nk = ny * w + nx;
          if (hit[nk] && !seen[nk]) { seen[nk] = 1; stack[sp++] = nk; }
        }
      }
    }
    if (area < 40) continue;
    regions.push({ box: [x0, y0, x1 + 1, y1 + 1], area: area });
  }
  if (!regions.length) return null;

  if (expect) {
    regions.sort((a, b) => {
      const sa = Math.abs((a.box[2]-a.box[0]) - expect[0]) + Math.abs((a.box[3]-a.box[1]) - expect[1]);
      const sb = Math.abs((b.box[2]-b.box[0]) - expect[0]) + Math.abs((b.box[3]-b.box[1]) - expect[1]);
      return sa - sb;
    });
  } else {
    regions.sort((a, b) => b.area - a.area);
  }
  return regions[0].box;
}

// Find the content inside an element: everything that is not its background.
// Measured relative to the element's own center, so a symmetric padding change
// does not read as the label having moved. This is what turns "something inside
// differs" into "the label sits 2pt low and is 6pt wider".
function contentBounds(d, box, rgb, dpr, tol) {
  // Mask to the element's actual painted shape row by row, not to an inset
  // rectangle. On a pill the page background shows through the rounded corners
  // well inside any fixed inset, so a rectangular mask measures the button's
  // interior rather than the label: 139 x 34 pt where the real label is 83 x 11.
  const edge = Math.round(2 * dpr);
  let a = 1e9, b = 1e9, c = -1, e = -1, ink = 0;
  let sr = 0, sg = 0, sb = 0, core = 0;
  let ar = 0, ag = 0, ab = 0;

  for (let y = box[1]; y < box[3]; y++) {
    // find where the element's own fill starts and ends on this row
    let left = -1, right = -1;
    for (let x = box[0]; x < box[2]; x++) {
      const i = (y * d.width + x) * 4;
      const s = Math.abs(d.data[i]-rgb[0]) + Math.abs(d.data[i+1]-rgb[1]) + Math.abs(d.data[i+2]-rgb[2]);
      if (s < tol) { if (left < 0) left = x; right = x; }
    }
    if (left < 0 || right - left < edge * 2) continue;

    // anything inside that span which is not the fill is content
    for (let x = left + edge; x <= right - edge; x++) {
      const i = (y * d.width + x) * 4;
      const s = Math.abs(d.data[i]-rgb[0]) + Math.abs(d.data[i+1]-rgb[1]) + Math.abs(d.data[i+2]-rgb[2]);
      if (s > tol) {
        ink++;
        ar += d.data[i]; ag += d.data[i+1]; ab += d.data[i+2];
        // Prefer pixels well clear of the fill, so antialiased glyph edges
        // blending toward the background do not drag the measured color. But a
        // label whose color is merely different, rather than much brighter, has
        // few such pixels, so fall back to the whole run when the core is thin.
        if (s > tol * 2.5) {
          sr += d.data[i]; sg += d.data[i+1]; sb += d.data[i+2]; core++;
        }
        if (x < a) a = x; if (x > c) c = x;
        if (y < b) b = y; if (y > e) e = y;
      }
    }
  }
  if (c < 0) return null;
  const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
  return {
    box: [a, b, c + 1, e + 1],
    w: (c + 1 - a) / dpr, h: (e + 1 - b) / dpr,
    dx: ((a + c + 1) / 2 - cx) / dpr,
    dy: ((b + e + 1) / 2 - cy) / dpr,
    // Share of the label's own box that is actually inked. Two fonts can occupy
    // the same bounds and still differ, and coverage is what separates them: a
    // heavier weight, a wider stroke or different letterforms all change how much
    // of the box is filled even when its size does not move.
    ink: ink / Math.max(1, (c + 1 - a) * (e + 1 - b)),
    color: core > ink * 0.15
      ? [Math.round(sr/core), Math.round(sg/core), Math.round(sb/core)]
      : (ink ? [Math.round(ar/ink), Math.round(ag/ink), Math.round(ab/ink)] : null)
  };
}

// Every color the element actually uses, with how much of it there is.
//
// The fill and label rules above each look at one thing. A border, an icon, a
// divider, a badge or a second text color are all outside their reach, and a
// design system has plenty of components where the interesting color is 2% of
// the area. This sweeps the whole element instead: mask to its painted shape,
// bucket every color inside, and keep anything that covers a meaningful share.
function palette(d, box, pageBg, dpr, minShare) {
  const buckets = {};
  let total = 0;
  const q = v => (v >> 4) << 4;   // 16 step quantization

  // Work row by row and take the span between the first and last pixel that is
  // not the page background, then keep everything inside it. Skipping pixels that
  // merely resemble the page misses a white label on a dark button entirely,
  // which is exactly the color most worth checking.
  for (let y = box[1]; y < box[3]; y++) {
    let left = -1, right = -1;
    for (let x = box[0]; x < box[2]; x++) {
      const i = (y * d.width + x) * 4;
      if (Math.abs(d.data[i]-pageBg[0]) + Math.abs(d.data[i+1]-pageBg[1]) +
          Math.abs(d.data[i+2]-pageBg[2]) >= 24) { if (left < 0) left = x; right = x; }
    }
    if (left < 0) continue;
    for (let x = left; x <= right; x++) {
      const i = (y * d.width + x) * 4;
      const r = d.data[i], g = d.data[i+1], b = d.data[i+2];
      const k = (q(r) << 16) | (q(g) << 8) | q(b);
      if (!buckets[k]) buckets[k] = { r: 0, g: 0, b: 0, n: 0 };
      const t = buckets[k];
      t.r += r; t.g += g; t.b += b; t.n++;
      total++;
    }
  }
  if (!total) return [];

  let list = Object.keys(buckets).map(k => {
    const t = buckets[k];
    return { rgb: [Math.round(t.r/t.n), Math.round(t.g/t.n), Math.round(t.b/t.n)],
             n: t.n };
  }).sort((a, b) => b.n - a.n);

  // Merge buckets that are really the same color split across a boundary, and
  // absorb antialiased blends into whichever real color they sit nearest.
  const merged = [];
  for (const c of list) {
    const near = merged.find(m =>
      Math.abs(m.rgb[0]-c.rgb[0]) + Math.abs(m.rgb[1]-c.rgb[1]) + Math.abs(m.rgb[2]-c.rgb[2]) < 40);
    if (near) {
      const tot = near.n + c.n;
      near.rgb = [Math.round((near.rgb[0]*near.n + c.rgb[0]*c.n)/tot),
                  Math.round((near.rgb[1]*near.n + c.rgb[1]*c.n)/tot),
                  Math.round((near.rgb[2]*near.n + c.rgb[2]*c.n)/tot)];
      near.n = tot;
    } else {
      merged.push({ rgb: c.rgb.slice(), n: c.n });
    }
  }
  return merged.filter(c => c.n / total >= minShare)
               .map(c => ({ rgb: c.rgb, share: c.n / total }))
               .sort((a, b) => b.share - a.share);
}

// Where a given color actually appears inside the element. A color finding with
// no location can only be read, not acted on: "something is 13 off" is far less
// useful than an arrow resting on the thing that is 13 off.
function colorRegion(d, box, rgb, tol) {
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, n = 0;
  for (let y = box[1]; y < box[3]; y++) {
    for (let x = box[0]; x < box[2]; x++) {
      const i = (y * d.width + x) * 4;
      if (Math.abs(d.data[i]-rgb[0]) + Math.abs(d.data[i+1]-rgb[1]) +
          Math.abs(d.data[i+2]-rgb[2]) < tol) {
        n++;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  return n > 8 ? [x0, y0, x1 + 1, y1 + 1] : null;
}

function dist(p, q) {
  return Math.abs(p[0]-q[0]) + Math.abs(p[1]-q[1]) + Math.abs(p[2]-q[2]);
}

// Measure a rendered label's own properties, independent of how wide the string
// happens to be.
//
// Width is a weak signal. It moves when the point size changes, when the string
// changes, when tracking changes, and when the typeface changes, so it cannot
// tell you which. These are the measures that separate those causes:
//
//   cap height   scales with point size and almost nothing else
//   stroke       scales with weight, and with size only proportionally
//   ratio        stroke over cap height, which is weight independent of size
//   density      ink over the label box, sensitive to both weight and letterform
//
// A label at the wrong point size moves cap height and stroke together and leaves
// the ratio alone. A label at the wrong weight moves stroke and ratio and leaves
// cap height alone. That distinction is the thing a width comparison cannot make.
function labelMetrics(d, box, bgRgb, tol) {
  const W = d.width;
  const rows = [];
  let inkTotal = 0;

  for (let y = box[1]; y < box[3]; y++) {
    let count = 0;
    const runs = [];
    let run = 0;
    for (let x = box[0]; x < box[2]; x++) {
      const i = (y * W + x) * 4;
      const isInk = Math.abs(d.data[i]-bgRgb[0]) + Math.abs(d.data[i+1]-bgRgb[1]) +
                    Math.abs(d.data[i+2]-bgRgb[2]) > tol;
      if (isInk) { count++; run++; }
      else { if (run) runs.push(run); run = 0; }
    }
    if (run) runs.push(run);
    inkTotal += count;
    rows.push({ y: y, count: count, runs: runs });
  }

  const inked = rows.filter(r => r.count > 0);
  if (inked.length < 3) return null;

  // Cap height: the band of rows carrying most of the ink. Ignores descenders and
  // the odd tall glyph, so it tracks point size rather than which letters appear.
  const peak = Math.max.apply(null, inked.map(r => r.count));
  const body = inked.filter(r => r.count >= peak * 0.25);
  const capH = body.length;

  // Stroke: the most common horizontal run length across the body rows. A run is
  // one crossing of a stem, so its mode is the stem width.
  const hist = {};
  for (const r of body) for (const len of r.runs) if (len <= 40) hist[len] = (hist[len] || 0) + 1;
  let stroke = 0, bestN = 0;
  for (const k of Object.keys(hist)) if (hist[k] > bestN) { bestN = hist[k]; stroke = +k; }

  return {
    capHeight: capH,
    stroke: stroke,
    ratio: capH ? stroke / capH : 0,
    density: inkTotal / Math.max(1, (box[2]-box[0]) * (box[3]-box[1]))
  };
}

// Read a resolved font string the way a person would write it.
//
// "Wells Fargo Sans SemiBold 17/24", "WellsFargoSans-SemiBold 17pt",
// ".SFUI-Semibold 17.0" and "Roboto Medium" all have to parse, because whatever
// the app prints is whatever the app prints and it will not be a schema.
function parseFont(str) {
  if (!str || !str.trim()) return null;
  let t = str.trim();

  // size, and line height if it is written as size/leading
  let size = null, leading = null;
  const sz = t.match(/(\d+(?:\.\d+)?)\s*(?:\/\s*(\d+(?:\.\d+)?))?\s*(?:pt|px|sp)?\s*$/i);
  if (sz) { size = parseFloat(sz[1]); if (sz[2]) leading = parseFloat(sz[2]);
            t = t.slice(0, sz.index).trim(); }

  // PostScript style: Family-Weight
  let family = t, weight = null;
  if (t.indexOf("-") > 0 && t.indexOf(" ") < 0) {
    const bits = t.split("-");
    weight = bits.pop(); family = bits.join("-");
  } else {
    const WEIGHTS = ["ultralight", "extralight", "thin", "light", "book", "regular",
                     "normal", "medium", "semibold", "demibold", "bold", "heavy",
                     "black", "extrabold", "ultrabold", "italic", "oblique"];
    const words = t.split(/\s+/);
    const tail = [];
    while (words.length > 1) {
      const w = words[words.length - 1].toLowerCase().replace(/[^a-z]/g, "");
      if (WEIGHTS.indexOf(w) >= 0) tail.unshift(words.pop()); else break;
    }
    family = words.join(" ");
    if (tail.length) weight = tail.join(" ");
  }
  return { family: family, weight: weight, size: size, leading: leading,
           raw: str.trim() };
}

// Compare loosely enough that punctuation and casing do not cause false alarms,
// strictly enough that a different family still fails.
function sameFamily(a, b) {
  // Strip punctuation and case, then collapse the several names Apple's system
  // font goes by. The collapse has to happen after the prefix check, not before,
  // or "SF Pro" becomes "system" and stops matching "SF Pro Text".
  const norm = x => (x || "").toLowerCase().replace(/[^a-z]/g, "");
  const sys  = x => /^(sfui|sfpro|sfprotext|sfprodisplay|system|systemfont|applesystemuifont)/.test(x)
                    ? "system" : x;
  const A = norm(a), B = norm(b);
  if (!A || !B) return null;
  if (A === B) return true;
  // One being a prefix of the other covers optical-size siblings: "SF Pro"
  // against "SF Pro Text", "Inter" against "Inter Display". Those are the same
  // typeface at a different optical size, not a substitution.
  if (A.indexOf(B) === 0 || B.indexOf(A) === 0) return true;
  return sys(A) === sys(B);
}

function sameWeight(a, b) {
  const norm = x => (x || "").toLowerCase().replace(/[^a-z]/g, "")
                     .replace("demibold", "semibold")
                     .replace("ultrabold", "extrabold")
                     .replace("book", "regular")
                     .replace("normal", "regular");
  const A = norm(a), B = norm(b);
  if (!A || !B) return null;
  return A === B;
}

function typeLine(t) {
  if (!t) return null;
  const bits = [];
  if (t.family) bits.push(t.family);
  if (t.weight) bits.push(t.weight);
  if (t.size) bits.push(t.size + " pt");
  if (t.lineHeight) bits.push("line " + t.lineHeight);
  if (t.letterSpacing && t.letterSpacing !== "0") bits.push("tracking " + t.letterSpacing);
  let out = bits.join(" \u00b7 ");
  if (t.styleName) out = t.styleName + "  (" + out + ")";
  const toks = [];
  if (t.familyToken) toks.push(t.familyToken);
  if (t.weightToken) toks.push(t.weightToken);
  if (t.sizeToken) toks.push(t.sizeToken);
  if (toks.length) out += "  \u2190 " + toks.join(", ");
  return out;
}

function tokenFor(paints, hexStr) {
  if (!paints) return null;
  let best = null, bestD = 1e9;
  for (const k of Object.keys(paints)) {
    const d = dist(hexRgb(k), hexRgb(hexStr));
    if (d < bestD) { bestD = d; best = paints[k]; }
  }
  return bestD <= 24 && best ? best : null;
}

function hexOf(rgb) {
  return "#" + rgb.map(v => v.toString(16).padStart(2, "0")).join("");
}

// ------------------------------------------------------------------ diff
function diff(A, B, ax, ay, bx, by, w, h, threshold) {
  const mask = new Uint8Array(w * h);
  const delta = new Int32Array(w * h);
  let changed = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ia = ((y + ay) * A.width + (x + ax)) * 4;
      const ib = ((y + by) * B.width + (x + bx)) * 4;
      const s = Math.abs(A.data[ia]-B.data[ib])
              + Math.abs(A.data[ia+1]-B.data[ib+1])
              + Math.abs(A.data[ia+2]-B.data[ib+2]);
      const k = y * w + x;
      delta[k] = s;
      if (s > threshold) { mask[k] = 1; changed++; }
    }
  }
  return { mask, delta, w, h, changed };
}

function dilate(mask, w, h, n) {
  let cur = mask;
  for (let pass = 0; pass < n; pass++) {
    const out = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (!cur[y * w + x]) continue;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && ny >= 0 && nx < w && ny < h) out[ny * w + nx] = 1;
          }
        }
      }
    }
    cur = out;
  }
  return cur;
}

// iterative flood fill, because a recursive one blows the stack on a big region
function cluster(mask, grown, w, h, minArea, delta) {
  const seen = new Uint8Array(w * h);
  const out = [];
  const stack = new Int32Array(w * h);
  for (let s = 0; s < w * h; s++) {
    if (!grown[s] || seen[s]) continue;
    let sp = 0; stack[sp++] = s; seen[s] = 1;
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, area = 0, members = 0, dsum = 0;
    while (sp > 0) {
      const k = stack[--sp];
      const x = k % w, y = (k / w) | 0;
      members++;
      if (mask[k]) { area++; dsum += delta[k]; }
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const nk = ny * w + nx;
          if (grown[nk] && !seen[nk]) { seen[nk] = 1; stack[sp++] = nk; }
        }
      }
    }
    if (area < minArea) continue;
    out.push({
      bbox: [x0, y0, x1, y1], area: area,
      fill: Math.round(area / Math.max(1, members) * 1000) / 1000,
      meanDelta: Math.round(dsum / Math.max(1, area) * 10) / 10
    });
  }
  return out.sort((a, b) => b.area - a.area);
}

function shapeOf(c, dpr) {
  const w = (c.bbox[2] - c.bbox[0] + 1) / dpr, h = (c.bbox[3] - c.bbox[1] + 1) / dpr;
  const ar = w / Math.max(0.001, h);
  if (w <= 14 && h <= 14) return "corner_or_small_detail";
  if (c.fill > 0.6 && w > 20 && h > 20) return "area_fill";
  if (ar > 4 && h <= 6) return "horizontal_edge";
  if (ar < 0.25 && w <= 6) return "vertical_edge";
  if (c.fill < 0.35) return "glyph_or_text";
  return "region";
}

// ------------------------------------------------------------------ run
async function run(data) {
  const dpr = data.dpr;
  const spec = data.spec;
  const threshold = +$("th").value, dl = +$("dl").value;
  const parts = [];
  if (data.dprNote) parts.push('<div class="note">' + data.dprNote + '</div>');

  // -- token layer, no image needed -----------------------------------------
  const tokenFindings = [];
  if (spec.unbound.length) {
    tokenFindings.push({
      id: "unbound_values", property: spec.unbound.join(", "),
      layer: "token", severity: "major",
      spec: "bound to a Prisme variable",
      observed: "raw value, no binding",
      evidence: "read from boundVariables on " + spec.name,
      bbox: null
    });
  }

  if (!spec.fill) {
    log('<div class="bad">The component has no solid fill, so it cannot be located ' +
        'in the screenshot. Pick a variant with a fill.</div>');
    return;
  }

  parts.push('<div class="note">' + (data.deviceNote || '') + '</div>');
  if (data.responsiveFallback) {
    parts.push('<div class="note">code.js did not return a responsive flag, so it ' +
      'is an older file than this panel. Comparing in responsive mode anyway, ' +
      'since the panel knows what was selected. Worth replacing code.js when ' +
      'convenient.</div>');
  }
  parts.push('<div class="note">comparing against <b>' + spec.name + '</b>, located ' +
             'by its ' + (spec.locateVia || "fill") + ' ' + spec.fill +
             (spec.paintedOn ? ' (read from the inner layer "' + spec.paintedOn + '")' : '') +
             (spec.geometryOn ? '<br>geometry read from "' + spec.geometryOn + '": padding ' +
              spec.paddingLeft + '/' + spec.paddingRight + ', gap ' + spec.itemSpacing : '') +
             '</div>');

  const shotImg = await decode(data.shotBytes);
  const canonImg = await decode(data.canonBytes);
  const A = toData(shotImg, $("cA"));
  const Braw = toData(canonImg, $("cB"));
  const B = flatten(Braw, [255, 255, 255]);

  const rgb = hexRgb(spec.fill);
  const inCanon = locate(B, rgb, 60);
  // knowing the canonical's pixel size lets the search pick the right region in
  // the screenshot rather than the largest patch of a common color
  const expect = inCanon ? [inCanon[2]-inCanon[0], inCanon[3]-inCanon[1]] : null;
  const inShot = locate(A, rgb, 60, expect);

  if (!inShot || !inCanon) {
    log('<div class="bad">Fill ' + spec.fill + ' not found in the ' +
        (!inShot ? "screenshot" : "canonical export") +
        '. Either this is the wrong variant, or that image does not contain ' +
        'this component.</div>');
    return;
  }

  const sw = (inShot[2]-inShot[0])/dpr, sh = (inShot[3]-inShot[1])/dpr;
  const cw = (inCanon[2]-inCanon[0])/dpr, ch = (inCanon[3]-inCanon[1])/dpr;
  parts.push('<div class="note">located: canonical ' + cw.toFixed(1) + ' x ' + ch.toFixed(1) +
             ' pt, capture ' + sw.toFixed(1) + ' x ' + sh.toFixed(1) + ' pt</div>');

  // -- identity gate ---------------------------------------------------------
  // On native, height is disqualifying: a button's height is fixed per size
  // variant, so a different height means a different component.
  //
  // On the web it is not. A calendar is taller in a month with six week rows than
  // one with five. A card grows with its content. A component in a fluid container
  // is whatever width the container gives it. Aborting on size there would refuse
  // to compare almost anything, so instead the difference is reported as a finding
  // and the comparison continues on the region the two have in common.
  // Read the dropdown directly rather than trusting the flag to survive the round
  // trip through code.js. The two files are separate and can drift apart, and when
  // they do the symptom is that a setting the panel offers appears to do nothing.
  // The panel already knows what was chosen, so it should not have to be told.
  const isResponsive = $("dev").value === "responsive" ||
                       !!(data.device && data.device.responsive);
  const dW = sw - cw, dH = sh - ch;
  let sizeDiff = false;

  if (isResponsive) {
    if (Math.abs(dW) > 2 || Math.abs(dH) > 2) {
      sizeDiff = true;
      parts.push('<div class="note">The component renders ' +
        (Math.abs(dW) > 2 ? Math.abs(dW).toFixed(0) + ' pt ' + (dW > 0 ? "wider" : "narrower") : "") +
        (Math.abs(dW) > 2 && Math.abs(dH) > 2 ? " and " : "") +
        (Math.abs(dH) > 2 ? Math.abs(dH).toFixed(0) + ' pt ' + (dH > 0 ? "taller" : "shorter") : "") +
        ' than the design. On the web that is often legitimate: content length, row ' +
        'count and container width all move size. Comparing the region the two ' +
        'have in common, aligned to the top.</div>');
    }
  } else {
    if (Math.abs(dH) > 2) {
      log(parts.join("") + '<div class="bad">ABORT: capture height differs by ' +
          Math.abs(dH).toFixed(1) + ' pt. On a native component, padding and radius ' +
          'defects do not change height, so this is a different component, size, or ' +
          'state. If this is a web component, choose Responsive web in the device ' +
          'menu and it will compare the overlap instead.</div>');
      return;
    }
    if (Math.abs(dW) > 2) {
      parts.push('<div class="note">width differs by ' + Math.abs(dW).toFixed(1) +
                 ' pt with height unchanged, which is the padding signature. Continuing.</div>');
    }
  }

  // -- pad the canonical, then align it onto the element in the capture -------
  // A node export is cropped tight to the element. Compare at that exact size and
  // an element that grew wider has its extra width fall outside the window, so
  // the defect is invisible. Padding the canonical with the capture's background
  // gives the growth somewhere to show.
  // Margin exists so an element that grew has somewhere to differ. It has to come
  // out of the capture, and a Storybook render is the component edge to edge with
  // nothing around it, so on the web there is often none available. Take what
  // there is rather than refusing: with no margin the comparison still works, it
  // simply cannot see growth beyond the frame, which it says below.
  const availL = inShot[0];
  const availT = inShot[1];
  const availR = A.width  - inShot[2];
  const availB = A.height - inShot[3];
  const M = Math.max(0, Math.min(Math.round(20 * dpr),
                                 availL, availT, availR, availB));
  const bgx = Math.max(0, inShot[0] - Math.round(M / 2));
  const bgy = Math.min(A.height - 1, inShot[1] + Math.round((inShot[3] - inShot[1]) / 2));
  const bi = (bgy * A.width + bgx) * 4;
  const bg = [A.data[bi], A.data[bi + 1], A.data[bi + 2]];

  const CAN = padded(B, M, bg);

  // Align by the element's CENTER, not its top left. A component sits centered in
  // its container, so symmetric padding growth pushes both edges outward. Aligning
  // by the left edge collapses that into a right edge change only, and the
  // two-strips-at-both-edges signature never appears.
  //
  // The exception is a responsive component whose height differs. Those grow
  // downward from a fixed header, so centering puts the header rows out of line
  // with each other and every row below reads as moved. Align the tops instead.
  const growsDown = isResponsive && Math.abs(dH) > 2;
  const shotCx = (inShot[0] + inShot[2]) / 2, shotCy = (inShot[1] + inShot[3]) / 2;
  const canCx = M + (inCanon[0] + inCanon[2]) / 2;
  const canCy = M + (inCanon[1] + inCanon[3]) / 2;
  const ox = Math.round(shotCx - canCx);
  const oy = growsDown
    ? Math.round(inShot[1] - (M + inCanon[1]))
    : Math.round(shotCy - canCy);
  // Clamp rather than refuse. A negative offset means the canonical would start
  // outside the capture, so crop both to the region they actually share.
  const sx = Math.max(0, ox), sy = Math.max(0, oy);
  const cx0 = Math.max(0, -ox), cy0 = Math.max(0, -oy);
  const w = Math.min(CAN.width - cx0, A.width - sx);
  const h = Math.min(CAN.height - cy0, A.height - sy);
  if (w < 8 || h < 8) {
    log(parts.join("") + '<div class="bad">The component and the design export ' +
        'barely overlap, so there is nothing meaningful to compare. Check that the ' +
        'right variant is selected.</div>');
    return;
  }
  if (M < Math.round(6 * dpr)) {
    parts.push('<div class="note">The capture has little or no margin around the ' +
      'component, which is normal for an isolated render. Anything that extends ' +
      'past the edge of the frame cannot be seen, so growth outward will be ' +
      'under-reported.</div>');
  }
  const D = diff(A, CAN, sx, sy, cx0, cy0, w, h, threshold);
  const grown = dilate(D.mask, w, h, dl);
  const cs = cluster(D.mask, grown, w, h, 12, D.delta);
  const pct = 100 * D.changed / (w * h);

  // The percentage gate is only a backstop, since the dimension check above is
  // the strong signal. It also has to allow for the legitimate case of an entire
  // element being very slightly the wrong color, which covers most of the window
  // at a tiny delta. So: a lot of area AND a large delta means mismatch. A lot of
  // area at a small delta is the hardcoded fill signature and must pass through.
  const worst = cs.length ? cs[0].meanDelta : 0;
  if (pct >= 60 && worst > 100) {
    log(parts.join("") + '<div class="bad">ABORT: ' + pct.toFixed(1) +
        '% of the compared area differs at a mean delta of ' + worst +
        '. That is not a defect, that is two different things.</div>');
    return;
  }

  // ---- measure the label before any rule runs -------------------------------
  // Several checks below depend on this, so it has to exist first. inCanon is
  // measured on B, the bare export. CAN is B padded by M on all sides, so the
  // element sits M further along both axes.
  const canonBox = [inCanon[0] + M, inCanon[1] + M, inCanon[2] + M, inCanon[3] + M];
  const canonC = contentBounds(CAN, canonBox, rgb, dpr, 90);
  const shotC = contentBounds(A, inShot, rgb, dpr, 90);

  // A hug width component sized to its text cannot be compared by width if the
  // two labels are not the same string. Say so once, loudly, rather than emitting
  // a padding finding, a size finding and a handful of antialiasing colors that
  // all trace back to the same cause.
  let labelMismatch = false;
  if (canonC && shotC) {
    const relW = Math.abs(shotC.w - canonC.w) / Math.max(1, canonC.w);
    if (relW > 0.15) {
      labelMismatch = true;
      parts.push('<div class="bad">The canonical label is ' + canonC.w.toFixed(1) +
        ' pt wide and the capture\'s is ' + shotC.w.toFixed(1) + ' pt, ' +
        (relW*100).toFixed(0) + '% apart. That almost always means the two are not ' +
        'showing the same text. On a hug width component every width based ' +
        'comparison below is then meaningless. Select the variant whose label ' +
        'matches the screenshot, or set the canonical\'s text to match.</div>');
    }
  }

  // -- clusters into findings ------------------------------------------------
  // Cluster coordinates are relative to the compared frame. Findings need them in
  // logical points relative to the whole screenshot, so the annotator can place
  // markers without knowing anything about the crop.
  const pixel = [];
  const P = (v, off) => Math.round((v + off) / dpr * 10) / 10;
  // Cluster coordinates are relative to the compared frame, which now starts at
  // (sx, sy) in the capture rather than at (ox, oy). Using the old offsets here
  // would place every marker wrong by the amount the frames were cropped.
  const toBox = b => [P(b[0], sx), P(b[1], sy), P(b[2], sx), P(b[3], sy)];
  // Every cluster must be either claimed by a rule or reported as unexplained.
  // Silently dropping the leftovers makes a tool that found five differences look
  // like a tool that found one, which is the worst possible way to be wrong.
  const claimed = new Set();
  const claim = cs2 => cs2.forEach(c => claimed.add(c));

  // Filter on geometry, not on the shape label. A padding strip classifies as
  // vertical_edge when it is thin and as area_fill when it is wide, depending on
  // how far the padding moved. What identifies it either way is that it runs the
  // full height of the element and there is a matching one at the far side.
  // Measure padding as the gap between the element edge and its content, in both
  // images. Inferring it from element width assumes both sides carry the same
  // label, and a hug width button's width is a function of its text: compare a
  // screenshot reading "Button text" against a canonical reading something else
  // and the width always differs, for no reason anyone should act on.
  let padFinding = false;
  let labelExplained = false;
  let labelExtent = null;
  if (canonC && shotC && spec.paddingLeft > 0) {
    const padCanonL = (canonC.box[0] - canonBox[0]) / dpr;
    const padCanonR = (canonBox[2] - canonC.box[2]) / dpr;
    const padShotL = (shotC.box[0] - inShot[0]) / dpr;
    const padShotR = (inShot[2] - shotC.box[2]) / dpr;
    const dL = padShotL - padCanonL, dR = padShotR - padCanonR;

    // Figma's paddingLeft is measured to the TEXT NODE's box. This measures to
    // the visible ink. A text node is normally a little wider than its ink, but
    // when the two disagree by a lot the node is carrying width the text does not
    // use, which is itself worth knowing: the button looks more padded than its
    // padding value says, and the value cannot be compared to anything measured
    // off a screenshot.
    const phantom = padCanonL - spec.paddingLeft;
    if (phantom > 2) {
      pixel.push({
        id: "phantom_padding", property: "text node wider than its text",
        layer: "token", severity: "minor",
        spec: "paddingLeft " + spec.paddingLeft + " pt" +
              (spec.bound.paddingLeft ? " (" + spec.bound.paddingLeft + ")" : ""),
        observed: padCanonL.toFixed(1) + " pt from the element edge to the visible ink",
        evidence: "The label's node is about " + (phantom * 2).toFixed(0) + " pt " +
                  "wider than the text inside it, so the component is that much " +
                  "wider than its padding value suggests. Usually a text layer set " +
                  "to fill or given a fixed width rather than hugging. It also " +
                  "means the declared padding cannot be checked against a " +
                  "screenshot directly.",
        bbox: null
      });
    }

    if (Math.abs(dL) >= 1 || Math.abs(dR) >= 1) {
      padFinding = true;
      const both = Math.abs(dL - dR) < 1.5;
      pixel.push({
        id: "padding_x", property: "space around the label", layer: "pixel",
        severity: Math.max(Math.abs(dL), Math.abs(dR)) >= 2 ? "major" : "minor",
        spec: padCanonL.toFixed(1) + " / " + padCanonR.toFixed(1) + " pt to the ink" +
              (phantom > 2 ? "  (declared padding is " + spec.paddingLeft + " pt)" : ""),
        observed: padShotL.toFixed(1) + " / " + padShotR.toFixed(1) + " pt  (" +
                  (dL >= 0 ? "+" : "") + dL.toFixed(1) + " left, " +
                  (dR >= 0 ? "+" : "") + dR.toFixed(1) + " right)",
        evidence: (both
          ? "Both sides moved by the same amount, so this is spacing rather than " +
            "the label having shifted. "
          : "The two sides moved by different amounts, which is an alignment or " +
            "content offset rather than symmetric spacing. ") +
          "Both figures are measured element edge to visible ink, so they are " +
          "directly comparable to each other even though neither equals Figma's " +
          "declared padding.",
        bbox: toBox([inShot[0]-sx, inShot[1]-sy, inShot[2]-sx, inShot[3]-sy]),
        // Redline dimensions, in screenshot logical points. A box around the
        // element says something is wrong with the spacing. These say which gap,
        // by how much, and against what. That is the difference between a finding
        // a developer reads and one they can act on.
        measures: [
          { from: [inShot[0]/dpr, ((inShot[1]+inShot[3])/2)/dpr],
            to:   [shotC.box[0]/dpr, ((inShot[1]+inShot[3])/2)/dpr],
            label: padShotL.toFixed(1) + " pt",
            spec: "was " + padCanonL.toFixed(1) },
          { from: [shotC.box[2]/dpr, ((inShot[1]+inShot[3])/2)/dpr],
            to:   [inShot[2]/dpr, ((inShot[1]+inShot[3])/2)/dpr],
            label: padShotR.toFixed(1) + " pt",
            spec: "was " + padCanonR.toFixed(1) }
        ]
      });
      claim(cs.filter(c => (c.bbox[3]-c.bbox[1])/dpr > ch * 0.8));
    }
  }

  const edges = cs.filter(c => (c.bbox[3] - c.bbox[1]) / dpr > ch * 0.8);
  if (!padFinding && edges.length >= 2 && Math.abs(sw - cw) > 1 && spec.paddingLeft > 0) {
    claim(edges);
    const b = [Math.min(edges[0].bbox[0], edges[1].bbox[0]),
               Math.min(edges[0].bbox[1], edges[1].bbox[1]),
               Math.max(edges[0].bbox[2], edges[1].bbox[2]),
               Math.max(edges[0].bbox[3], edges[1].bbox[3])];
    pixel.push({
      id: "padding_x", property: "paddingHorizontal", layer: "pixel", severity: "major",
      spec: spec.paddingLeft + " pt" + (spec.bound.paddingLeft ? "  (" + spec.bound.paddingLeft + ")" : ""),
      observed: Math.max(0, spec.paddingLeft + (sw - cw) / 2).toFixed(1) + " pt",
      evidence: "two full height strips at both edges, element " + sw.toFixed(0) +
                "x" + sh.toFixed(0) + " pt against " + cw.toFixed(0) + "x" + ch.toFixed(0) + " canonical",
      bbox: toBox(b)
    });
  }

  const smalls = cs.filter(c => shapeOf(c, dpr) === "corner_or_small_detail");
  if (smalls.length >= 4 && !pixel.length) {
    claim(smalls);
    const b = smalls.reduce((a, c) => [Math.min(a[0],c.bbox[0]), Math.min(a[1],c.bbox[1]),
                                       Math.max(a[2],c.bbox[2]), Math.max(a[3],c.bbox[3])],
                            [1e9,1e9,-1,-1]);
    pixel.push({
      id: "radius", property: "cornerRadius", layer: "pixel", severity: "major",
      spec: spec.cornerRadius + " pt" + (spec.bound.topLeftRadius ? "  (" + spec.bound.topLeftRadius + ")" : ""),
      observed: "differs, " + smalls.length + " corner clusters",
      evidence: "small clusters at the corners and nowhere else",
      bbox: toBox(b)
    });
  }

  const big = cs.filter(c => shapeOf(c, dpr) === "area_fill" && c.fill > 0.85
                          && c.meanDelta < 40);
  if (big.length) {
    claim(big);
    const c = big[0];
    pixel.push({
      id: "fill_delta", property: "fill", layer: "token", severity: "major",
      spec: spec.fill + (spec.fillBound ? "  (" + spec.fillBound + ")" : ""),
      observed: "differs by " + c.meanDelta + " of 765 across the whole element",
      evidence: "large area, fill ratio " + c.fill + ", tiny delta. That is a " +
                "hardcoded value rather than a bound variable.",
      bbox: toBox(c.bbox)
    });
  }

  const glyphs = cs.filter(c => shapeOf(c, dpr) === "glyph_or_text");
  if (glyphs.length >= 3) {
    claim(glyphs);
    const b = glyphs.reduce((a, c) => [Math.min(a[0],c.bbox[0]), Math.min(a[1],c.bbox[1]),
                                       Math.max(a[2],c.bbox[2]), Math.max(a[3],c.bbox[3])],
                            [1e9,1e9,-1,-1]);
    pixel.push({
      id: "text_drift", property: "label position", layer: "pixel", severity: "minor",
      spec: "matches canonical",
      observed: glyphs.length + " glyph clusters differ",
      evidence: "scattered clusters over a text run, consistent with baseline or " +
                "letter spacing drift",
      bbox: toBox(b)
    });
  }

  // ---- findings derived from the label measurement -------------------------
  if (canonC && shotC) {
    const ddx = Math.round((shotC.dx - canonC.dx) * 10) / 10;
    const ddy = Math.round((shotC.dy - canonC.dy) * 10) / 10;
    const ddw = Math.round((shotC.w - canonC.w) * 10) / 10;
    const ddh = Math.round((shotC.h - canonC.h) * 10) / 10;
    const labelBox = [Math.round(shotC.box[0]/dpr*10)/10, Math.round(shotC.box[1]/dpr*10)/10,
                      Math.round(shotC.box[2]/dpr*10)/10, Math.round(shotC.box[3]/dpr*10)/10];

    // Whichever of these fires, the label's clusters are accounted for. Claiming
    // per rule left them unclaimed when only one fired, and the catch-all then
    // reported the same pixels a second time.
    labelExplained = true;

    if (Math.abs(ddy) >= 0.7 || Math.abs(ddx) >= 0.7) {
      pixel.push({
        id: "content_offset", property: "label position", layer: "pixel",
        severity: Math.max(Math.abs(ddx), Math.abs(ddy)) >= 2 ? "major" : "minor",
        spec: "centered in the element",
        observed: (ddy ? (ddy > 0 ? ddy + " pt low" : (-ddy) + " pt high") : "") +
                  (ddx && ddy ? ", " : "") +
                  (ddx ? (ddx > 0 ? ddx + " pt right" : (-ddx) + " pt left") : ""),
        evidence: "Content center measured against the element center in both " +
                  "images, so a padding change does not affect this number.",
        bbox: labelBox, point: true
      });
    }

    // Label extent is reported only when the type measurement finds nothing, and
    // only when the difference is large. On its own it says almost nothing: the
    // label's width moves with the string, with tracking, and with point size, so
    // firing on it invites people to chase a difference that is usually just
    // different text. Size and weight are measured properly by the type check
    // below, from cap height and stroke thickness.
    labelExtent = { ddw: ddw, ddh: ddh, box: labelBox };

    // Label color. The palette sweep looks at the element as a whole, so without
    // this a label in the wrong color is only ever a percentage rather than a
    // named token.
    if (canonC.color && shotC.color) {
      const dc = dist(canonC.color, shotC.color);
      if (dc > 10) {
        pixel.push({
          id: "label_color", property: "label color", layer: "pixel",
          severity: dc > 60 ? "major" : "minor",
          spec: hexOf(canonC.color) +
                (spec.type && spec.type.colorToken ? "  (" + spec.type.colorToken + ")" : ""),
          observed: hexOf(shotC.color) + "  (" + dc + " of 765)",
          evidence: dc < 40
            ? "A small difference across the whole label is the hardcoded hex " +
              "signature: a value typed in rather than bound to a text color token."
            : "The label is a materially different color from the canonical.",
          bbox: labelBox, point: true
        });
      }
    }

    // Measure the type itself rather than inferring from how wide the string is.
    const canonM = labelMetrics(CAN, canonC.box, rgb, 90);
    const shotM  = labelMetrics(A, shotC.box, rgb, 90);

    if (canonM && shotM && canonM.capHeight && canonM.stroke) {
      const dCap    = (shotM.capHeight - canonM.capHeight) / dpr;
      const relCap  = (shotM.capHeight - canonM.capHeight) / canonM.capHeight;
      const relStr  = (shotM.stroke - canonM.stroke) / canonM.stroke;
      const relRat  = canonM.ratio ? (shotM.ratio - canonM.ratio) / canonM.ratio : 0;

      const sizeOff   = Math.abs(relCap) >= 0.06;
      const weightOff = Math.abs(relRat) >= 0.12;

      if (sizeOff || weightOff) {
        // cap height is about 70% of point size for most text faces, which is
        // close enough to name a likely size rather than only a direction
        const specPt = spec.type && spec.type.size ? spec.type.size : null;
        const impliedPt = specPt ? specPt * (shotM.capHeight / canonM.capHeight) : null;

        let cause, detail;
        if (sizeOff && !weightOff) {
          cause = "point size";
          detail = "Cap height moved " + (relCap*100).toFixed(0) + "% while the " +
                   "stroke to cap ratio held steady. That is the signature of the " +
                   "same type set at a different point size.";
        } else if (weightOff && !sizeOff) {
          cause = "weight";
          detail = "Cap height is unchanged but the stroke is " +
                   (relStr > 0 ? "thicker" : "thinner") + " by " +
                   Math.abs(relStr*100).toFixed(0) + "%. Same size, different " +
                   "weight, or a different typeface at the same nominal size.";
        } else {
          cause = "size and weight";
          detail = "Cap height moved " + (relCap*100).toFixed(0) + "% and the " +
                   "stroke to cap ratio moved " + (relRat*100).toFixed(0) + "%, but " +
                   "so both are off. Check the size and the weight together.";
        }

        pixel.push({
          id: "label_type", property: "label type (" + cause + ")",
          layer: "pixel",
          severity: (Math.abs(relCap) >= 0.20 || Math.abs(relRat) >= 0.50) ? "major" : "minor",
          spec: (typeLine(spec.type) || "as designed") +
                "\ncap " + (canonM.capHeight/dpr).toFixed(1) + " pt \u00b7 stroke " +
                (canonM.stroke/dpr).toFixed(2) + " pt \u00b7 stroke/cap " +
                canonM.ratio.toFixed(3),
          observed: "cap " + (shotM.capHeight/dpr).toFixed(1) + " pt \u00b7 stroke " +
                    (shotM.stroke/dpr).toFixed(2) + " pt \u00b7 stroke/cap " +
                    shotM.ratio.toFixed(3) +
                    (impliedPt && sizeOff
                      ? "\nimplies about " + impliedPt.toFixed(1) + " pt against a " +
                        "specified " + specPt + " pt"
                      : ""),
          evidence: detail + " Measured from the rendered glyphs, so it does not " +
                    "depend on the two labels carrying the same string.",
          bbox: labelBox, point: true
        });
      }
    }

    // ---- resolved font, if the app told us what it used --------------------
    const declared = parseFont($("font").value);
    if (declared && spec.type) {
      const famOk = sameFamily(spec.type.family, declared.family);
      const wgtOk = sameWeight(spec.type.weight, declared.weight);
      const szOk  = (spec.type.size && declared.size)
                    ? Math.abs(spec.type.size - declared.size) < 0.6 : null;

      if (famOk === false) {
        pixel.push({
          id: "font_family", property: "font family", layer: "token",
          severity: "major",
          spec: spec.type.family +
                (spec.type.familyToken ? "  (" + spec.type.familyToken + ")" : ""),
          observed: declared.family + "   \u2190 what the app actually rendered",
          evidence: "The app resolved a different family than the component " +
                    "specifies. The usual cause is font fallback: the requested " +
                    "family did not ship in this build and the system substituted " +
                    "its default. Nothing about the rendering looks broken when " +
                    "this happens, which is why it survives review.",
          bbox: labelBox, point: true
        });
      } else if (wgtOk === false) {
        pixel.push({
          id: "font_weight", property: "font weight", layer: "token",
          severity: "major",
          spec: (spec.type.weight || "as designed") +
                (spec.type.weightToken ? "  (" + spec.type.weightToken + ")" : ""),
          observed: declared.weight + "   \u2190 what the app actually rendered",
          evidence: "Right family, wrong weight. Often the requested weight is " +
                    "missing from the bundled family and the system picked the " +
                    "nearest available one.",
          bbox: labelBox, point: true
        });
      }

      if (szOk === false) {
        pixel.push({
          id: "font_size", property: "font size", layer: "token",
          severity: "major",
          spec: spec.type.size + " pt" +
                (spec.type.sizeToken ? "  (" + spec.type.sizeToken + ")" : ""),
          observed: declared.size + " pt   \u2190 what the app actually rendered",
          evidence: "Reported by the app rather than measured, so this is exact.",
          bbox: labelBox, point: true
        });
      }

      if (famOk && wgtOk !== false && szOk !== false) {
        parts.push('<div class="note">resolved font matches: ' + declared.raw +
                   '</div>');
      }
    }

    // Extent, only if nothing better explained the label and the gap is wide.
    if (!pixel.some(f => f.id === "label_type") && labelExtent &&
        Math.abs(labelExtent.ddw) >= Math.max(4, canonC.w * 0.12)) {
      pixel.push({
        id: "content_size", property: "label extent", layer: "pixel",
        severity: "minor",
        spec: canonC.w.toFixed(1) + " x " + canonC.h.toFixed(1) + " pt",
        observed: shotC.w.toFixed(1) + " x " + shotC.h.toFixed(1) + " pt  (" +
                  (labelExtent.ddw >= 0 ? "+" : "") + labelExtent.ddw + " wide, " +
                  (labelExtent.ddh >= 0 ? "+" : "") + labelExtent.ddh + " tall)",
        evidence: "The label occupies a different width, but its cap height and " +
                  "stroke thickness both match, so the type is set correctly. " +
                  "This is different text, different tracking, or a truncation.",
        bbox: labelExtent.box, point: true
      });
    }

    // Ink density as a backstop, for the case where cap height and stroke both
    // match and the letterforms themselves still differ.
    const dInk = shotC.ink - canonC.ink;
    const relInk = canonC.ink > 0 ? dInk / canonC.ink : 0;
    const typeNamed = pixel.some(f => f.id === "label_type");
    if (!typeNamed && Math.abs(relInk) >= 0.25) {
      pixel.push({
        id: "label_rendering", property: "label rendering", layer: "pixel",
        severity: Math.abs(relInk) >= 0.2 ? "major" : "minor",
        spec: (canonC.ink * 100).toFixed(1) + "% of the label box inked" +
              (typeLine(spec.type) ? "\n" + typeLine(spec.type) : ""),
        observed: (shotC.ink * 100).toFixed(1) + "%  (" + (relInk > 0 ? "+" : "") +
                  (relInk * 100).toFixed(0) + "% relative)",
        evidence: "Cap height and stroke both match, so the size and weight are " +
                  "right. The glyphs still cover a different share of their box, " +
                  "which usually means different text rather than anything wrong " +
                  "with how the type is set.",
        bbox: labelBox, point: true
      });
    }
  }

  // ---- full palette sweep --------------------------------------------------
  const pageBgI = ((Math.max(0, inShot[1] - Math.round(6*dpr))) * A.width + inShot[0]) * 4;
  const pageBg = [A.data[pageBgI], A.data[pageBgI+1], A.data[pageBgI+2]];
  const geometryOff = labelMismatch || Math.abs(sw - cw) > 2 || Math.abs(sh - ch) > 2;
  const floor = (+$("cf").value) / 10000;
  const canonPal = palette(CAN, canonBox, pageBg, dpr, floor);
  const shotPal = palette(A, inShot, pageBg, dpr, floor);

  if (canonPal.length && shotPal.length) {
    if (geometryOff) {
      parts.push('<div class="note">The two elements are not the same size, so ' +
        'color findings under 6% of the area are held back. Their edges land in ' +
        'different places and every antialiased blend reads as a small shift.</div>');
    }
    parts.push('<div class="note">palette at a ' + (floor*100).toFixed(2) +
      '% floor: ' + canonPal.length + ' colors in the canonical, ' +
      shotPal.length + ' in the capture' +
      (floor <= 0.0005 ? '. At this floor antialiased blends along edges start ' +
       'appearing as colors of their own.' : '') + '</div>');

    const usedShot = new Set();
    for (const c of canonPal) {
      let best = null, bestD = 1e9;
      shotPal.forEach((t, i) => {
        if (usedShot.has(i)) return;
        const dd = dist(c.rgb, t.rgb);
        if (dd < bestD) { bestD = dd; best = i; }
      });

      if (best === null || bestD > 150) {
        pixel.push({
          id: "color_missing_" + hexOf(c.rgb).slice(1),
          property: "missing color " + hexOf(c.rgb),
          layer: "pixel", severity: "major",
          spec: hexOf(c.rgb) + (function(){ const t = tokenFor(spec.paints, hexOf(c.rgb));
                return t ? "  (" + (t.token || t.prop + " on " + t.layer) + ")" : ""; })() +
                " covering " + (c.share*100).toFixed(1) + "% of the element",
          observed: "no comparable color in the capture",
          evidence: "A color the design uses does not appear on screen at all. " +
                    "A border, icon or divider that was dropped, or a state that " +
                    "did not render.",
          bbox: null
        });
        continue;
      }

      usedShot.add(best);
      const t = shotPal[best];
      // With mismatched geometry the antialiased blends differ everywhere, and
      // every one of them looks like a small color shift. Only trust the large
      // areas until the elements are actually comparable.
      // When the two elements are not the same size, every antialiased edge
      // lands somewhere different and each blend reads as a small color shift.
      // Those are artifacts of the geometry, not color defects, so hold back the
      // small-area ones until the elements are actually comparable. Raising the
      // floor would hide them too, but it would also hide real details on a
      // component that lines up fine.
      const minD = geometryOff ? 40 : 10;
      if (bestD > minD && !(geometryOff && c.share < 0.06)) {
        const smallArea = c.share < 0.06;
        pixel.push({
          id: "color_" + hexOf(c.rgb).slice(1),
          property: (smallArea ? "detail color" : "area color") +
                    " (" + (c.share*100).toFixed(1) + "% of the element)",
          layer: "pixel", severity: bestD > 60 ? "major" : "minor",
          spec: hexOf(c.rgb) + (function(){ const k = tokenFor(spec.paints, hexOf(c.rgb));
                return k ? "  (" + (k.token || k.prop + " on " + k.layer) + ")" : ""; })(),
          observed: hexOf(t.rgb) + "  (" + bestD + " of 765)",
          evidence: bestD < 40
            ? "Small shift across a consistent area. Typically a hardcoded hex " +
              "rather than a bound variable."
            : "Materially different color. Check which token this should resolve to.",
          bbox: (function () {
            const r = colorRegion(A, inShot, t.rgb, 60);
            return r ? [Math.round(r[0]/dpr*10)/10, Math.round(r[1]/dpr*10)/10,
                        Math.round(r[2]/dpr*10)/10, Math.round(r[3]/dpr*10)/10] : null;
          })(),
          point: true
        });
      }
    }

    shotPal.forEach((t, i) => {
      if (usedShot.has(i)) return;
      const nearest = canonPal.reduce((m, c) => Math.min(m, dist(c.rgb, t.rgb)), 1e9);
      if (nearest > 150) {
        pixel.push({
          id: "color_extra_" + hexOf(t.rgb).slice(1),
          property: "unexpected color " + hexOf(t.rgb),
          layer: "pixel", severity: "minor",
          spec: "not present in the design",
          observed: hexOf(t.rgb) + " covering " + (t.share*100).toFixed(1) + "%",
          evidence: "Something on screen uses a color the component does not. " +
                    "An overlay, a focus ring, or a state the canonical is not in.",
          bbox: (function () {
            const r = colorRegion(A, inShot, t.rgb, 60);
            return r ? [Math.round(r[0]/dpr*10)/10, Math.round(r[1]/dpr*10)/10,
                        Math.round(r[2]/dpr*10)/10, Math.round(r[3]/dpr*10)/10] : null;
          })(),
          point: true
        });
      }
    });
  }

  if (sizeDiff) {
    pixel.push({
      id: "element_size", property: "rendered size", layer: "pixel",
      severity: Math.abs(dW) > cw * 0.15 || Math.abs(dH) > ch * 0.25 ? "major" : "minor",
      spec: cw.toFixed(0) + " x " + ch.toFixed(0) + " pt in the design",
      observed: sw.toFixed(0) + " x " + sh.toFixed(0) + " pt as rendered  (" +
                (dW >= 0 ? "+" : "") + dW.toFixed(0) + " wide, " +
                (dH >= 0 ? "+" : "") + dH.toFixed(0) + " tall)",
      evidence: "Worth checking rather than assuming wrong. A width difference " +
                "usually means the container, not the component: a fluid element " +
                "takes whatever width it is given, and a design frame often has " +
                "margins the isolated render does not. A height difference usually " +
                "means content: more rows, longer text, an extra state. Compare " +
                "against the design frame for this breakpoint before treating it " +
                "as a defect.",
      bbox: null
    });
  }

  // Anything inside the element that no rule claimed is a content difference:
  // a label that moved, changed weight, re-rendered in a different font, or an
  // icon that is not the same shape. The tool cannot name which, but it must not
  // stay quiet about it.
  if (labelExplained && shotC && canonC) {
    // Claim the label region in BOTH images. When the two elements are different
    // widths the label sits at a different x in each, so the diff produces glyph
    // clusters in two places. Claiming only the capture's position leaves the
    // canonical's glyphs unaccounted for, and they resurface as "unexplained".
    const pad = 12 * dpr;
    const inBox = (cx, cy, b) => cx >= b[0]-pad && cx <= b[2]+pad &&
                                 cy >= b[1]-pad && cy <= b[3]+pad;
    claim(cs.filter(c => {
      const mx = (c.bbox[0]+c.bbox[2])/2, my = (c.bbox[1]+c.bbox[3])/2;
      // cluster coordinates are in the compared frame, which is the padded
      // canonical, so canonC needs no offset and shotC needs the capture's
      // canonC.box is in the padded canonical's frame, shotC.box is in the
      // capture's, and the cluster sits in the compared frame between them.
      return inBox(mx + cx0, my + cy0, canonC.box) ||
             inBox(mx + sx, my + sy, shotC.box);
    }));
  }

  // The catch-all exists so nothing is silently dropped, not so that findings get
  // reported twice. When rules have already explained what is wrong with the
  // element, a leftover cluster inside it is almost always the same defect seen
  // from a different angle. Only speak up when nothing else has, or when the
  // difference sits outside the element entirely.
  let leftover = cs.filter(c => !claimed.has(c));
  if (leftover.length && pixel.length) {
    leftover = leftover.filter(c => {
      const cx = (c.bbox[0] + c.bbox[2]) / 2 + sx;
      const cy = (c.bbox[1] + c.bbox[3]) / 2 + sy;
      const pad = 4 * dpr;
      const insideElement = cx >= inShot[0] - pad && cx <= inShot[2] + pad &&
                            cy >= inShot[1] - pad && cy <= inShot[3] + pad;
      return !insideElement;
    });
  }
  if (leftover.length) {
    const b = leftover.reduce((a, c) => [Math.min(a[0],c.bbox[0]), Math.min(a[1],c.bbox[1]),
                                         Math.max(a[2],c.bbox[2]), Math.max(a[3],c.bbox[3])],
                              [1e9,1e9,-1,-1]);
    const area = leftover.reduce((a, c) => a + c.area, 0);
    const worst = Math.max.apply(null, leftover.map(c => c.meanDelta));
    const inner = leftover.filter(c => {
      const cx = (c.bbox[0]+c.bbox[2])/2, cy = (c.bbox[1]+c.bbox[3])/2;
      return cx > inShot[0]-ox + 8*dpr && cx < inShot[2]-ox - 8*dpr;
    });
    pixel.push({
      id: "content_diff",
      property: "unexplained regions",
      layer: "pixel",
      severity: worst > 200 ? "major" : "minor",
      spec: "matches the canonical",
      observed: leftover.length + " region" + (leftover.length === 1 ? "" : "s") +
                " differ, " + area + " px, peak delta " + worst,
      evidence: "Differences outside the element that no rule accounts for. " +
                "Something adjacent to the component differs: a neighboring " +
                "element, a shadow, or a background the canonical does not have.",
      bbox: toBox(b)
    });
  }

  if (Math.abs(sw - cw) > 1 && !(spec.paddingLeft > 0)) {
    pixel.push({
      id: "width_mismatch", property: "width", layer: "pixel", severity: "major",
      spec: cw.toFixed(1) + " pt",
      observed: sw.toFixed(1) + " pt",
      evidence: "The element is a different width but the component reports no " +
                "horizontal padding, so there is no spec number to compare against. " +
                "Check whether padding lives on a nested frame this did not reach.",
      bbox: null
    });
  }

  // Group findings by kind. Eight arrows converging on one small button is
  // unreadable however neatly they are fanned, and a reviewer thinks in
  // categories anyway: spacing is one conversation, color is another.
  function groupOf(f) {
    const id = f.id || "";
    if (/padding|spacing|phantom|width_mismatch/.test(id)) return "spacing";
    if (/radius/.test(id)) return "shape";
    if (/font_|label_type|label_rendering|content_size|content_offset/.test(id)) return "type";
    if (/color|colour|fill/.test(id)) return "color";
    return "other";
  }

  const all = tokenFindings.concat(pixel);
  all.forEach(f => { f.group = groupOf(f); });

  // Pixel perfect check: how many pixels differ at all, and by how much at worst.
  // The threshold slider governs what counts as a finding; this reports the raw
  // truth underneath it, which is the number that matters when the target is an
  // exact match rather than a tolerable one.
  let anyDiff = 0, maxDelta = 0;
  for (let k = 0; k < D.delta.length; k++) {
    if (D.delta[k] > 0) { anyDiff++; if (D.delta[k] > maxDelta) maxDelta = D.delta[k]; }
  }
  parts.push('<div class="note">exact match: ' +
    (anyDiff === 0
      ? '<b>identical</b>, every pixel matches'
      : '<b>' + anyDiff + '</b> of ' + (w*h) + ' pixels differ (' +
        (100*anyDiff/(w*h)).toFixed(3) + '%), worst delta ' + maxDelta + ' of 765') +
    '</div>');

  parts.push('<div class="note">' + cs.length + ' clusters, ' + pct.toFixed(3) +
             '% changed, threshold ' + threshold +
             '  \u00b7  ' + claimed.size + ' explained by a rule, ' +
             (cs.length - claimed.size) + ' not</div><hr>');

  if (!all.length) {
    parts.push('<div class="card"><div class="h">No findings</div><div class="ev">' +
      'Nothing above threshold, and every geometry property is bound. If this is a ' +
      'real device capture rather than a fixture, the number above is your noise floor.' +
      '</div></div>');
  }
  all.forEach((f, i) => {
    parts.push('<div class="card"><div class="h">' + (i+1) + '. ' + f.property + '</div>' +
      '<div class="m">' + f.layer + ' &middot; ' + f.severity + '</div>' +
      '<div class="kv"><span>spec</span><span>' + String(f.spec).replace(/\n/g, "<br>") + '</span></div>' +
      '<div class="kv obs"><span>observed</span><span>' + f.observed + '</span></div>' +
      '<div class="ev">' + f.evidence + '</div></div>');
  });
  log(parts.join(""));

  // populate the group picker from what was actually found
  (function () {
    const counts = {};
    all.forEach(f => { if (f.bbox) counts[f.group] = (counts[f.group] || 0) + 1; });
    const keys = Object.keys(counts);
    const sel = $("groupSel");
    sel.innerHTML = "";
    const add = (v, t) => { const o = document.createElement("option");
                            o.value = v; o.textContent = t; sel.appendChild(o); };
    const drawable = all.filter(f => f.bbox).length;
    add("all", "All findings on one board (" + drawable + ")");
    if (keys.length > 1) add("split", "Separate board per group (" + keys.length + ")");
    keys.forEach(k => add(k, k.charAt(0).toUpperCase() + k.slice(1) + " only (" + counts[k] + ")"));
    // default to splitting once it would otherwise be crowded
    sel.value = (drawable >= 5 && keys.length > 1) ? "split" : "all";
    $("groupRow").style.display = drawable ? "block" : "none";
  })();

  lastPayload = {
    findings: all,
    shotNodeId: data.shotNodeId,
    device: data.device,
    logicalShot: [data.shotPixels[0] / dpr, data.shotPixels[1] / dpr],
    dprNote: data.dprNote,
    title: spec.name,
    subtitle: all.length + " findings  \u00b7  " +
              (data.device ? data.device.name : "derived") + " @" + dpr +
              "x  \u00b7  " + cs.length + " clusters, " + pct.toFixed(3) +
              "% changed  \u00b7  threshold " + threshold
  };
  $("draw").style.display = all.some(f => f.bbox) ? "block" : "none";
}

// ------------------------------------------------------------------ wiring
function chosenDevice() {
  const v = $("dev").value;
  if (v === "auto") return null;
  if (v === "responsive") {
    // A breakpoint is a range, not a width. Fusion has two: Small to Medium at
    // 320 to 767, and Large to X_Large at 768 and up. Within a range the component
    // is fluid, so its width is whatever the container gives it. What matters is
    // that the capture falls inside the range the design frame describes, not that
    // it equals some specific number.
    let lo, hi, label;
    if ($("bp").value === "custom") {
      lo = parseInt($("bpMin").value, 10) || 320;
      hi = parseInt($("bpMax").value, 10) || 767;
      label = lo + "\u2013" + hi + "px";
    } else {
      const parts = $("bp").value.split("-");
      lo = parseInt(parts[0], 10); hi = parseInt(parts[1], 10);
      label = $("bp").selectedOptions[0].text.split("\u00b7")[0].trim();
    }
    const dpr = parseFloat($("bpScale").value) || 1;
    return { responsive: true, rangeLo: lo, rangeHi: hi, dpr: dpr, name: label };
  }
  if (v === "custom") return { custom: true, dpr: parseFloat($("dpr").value) || 3 };
  const p = v.split("x").map(Number);
  return { lw: p[0], lh: p[1], dpr: p[2], name: $("dev").selectedOptions[0].text.split("\u00b7")[0].trim() };
}

// Remember the whole setup between runs. Losing the device selection back to
// Auto detect mid-session is how a responsive comparison silently turns into a
// native one and aborts.
const REMEMBER = ["font", "dev", "bp", "bpMin", "bpMax", "bpScale", "th", "dl", "cf"];
function save() {
  try {
    const st = {};
    REMEMBER.forEach(id => { if ($(id)) st[id] = $(id).value; });
    sessionStorage.setItem("vqaState", JSON.stringify(st));
  } catch (e) {}
}
try {
  const st = JSON.parse(sessionStorage.getItem("vqaState") || "{}");
  REMEMBER.forEach(id => { if ($(id) && st[id] != null) $(id).value = st[id]; });
  $("thVal").textContent = $("th").value;
  $("dlVal").textContent = $("dl").value;
  $("cfVal").textContent = (+$("cf").value / 100).toFixed(2) + "%";
  $("dprRow").style.display = $("dev").value === "custom" ? "flex" : "none";
  $("bpRow").style.display  = $("dev").value === "responsive" ? "flex" : "none";
  const custom = $("bp").value === "custom";
  $("bpMin").style.display = custom ? "inline-block" : "none";
  $("bpMax").style.display = custom ? "inline-block" : "none";
} catch (e) {}
REMEMBER.forEach(id => { if ($(id)) $(id).addEventListener("change", save); });
$("font").oninput = save;

$("dev").onchange = () => {
  const v = $("dev").value;
  $("dprRow").style.display = v === "custom" ? "flex" : "none";
  $("bpRow").style.display  = v === "responsive" ? "flex" : "none";
  save();
};

$("bp").onchange = () => {
  const custom = $("bp").value === "custom";
  $("bpMin").style.display = custom ? "inline-block" : "none";
  $("bpMax").style.display = custom ? "inline-block" : "none";
  save();
};

$("resize").onclick = () => {
  parent.postMessage({ pluginMessage: { type: "resizeOnly", device: chosenDevice() } }, "*");
};

$("run").onclick = () => {
  log('<div class="note">reading selection\u2026</div>');
  parent.postMessage({ pluginMessage: { type: "collect", device: chosenDevice() } }, "*");
};
$("renum").onclick = () => {
  parent.postMessage({ pluginMessage: { type: "renumber" } }, "*");
};

$("draw").onclick = () => {
  lastPayload.mode = $("groupSel").value || "all";
  parent.postMessage({ pluginMessage: { type: "annotate", payload: lastPayload } }, "*");
};

const UI_VERSION = "v41";

onmessage = async (e) => {
  const m = e.data.pluginMessage;
  if (!m) return;

  // code.js and ui.html are separate files and can drift apart, most often when
  // only one of the two gets replaced. The symptom is baffling: the UI offers a
  // setting the main thread does not understand, so the setting appears to do
  // nothing. Catch it here rather than letting the user infer it from behaviour.
  if (m.type === "version") {
    const badge = document.querySelector("h1 span");
    if (m.version !== UI_VERSION) {
      if (badge) { badge.textContent = UI_VERSION + " ui / " + m.version + " code";
                   badge.style.color = "var(--flag)"; }
      log('<div class="bad"><b>Mismatched files.</b> ui.html is ' + UI_VERSION +
          ' and code.js is ' + m.version + '. They are separate files and both have ' +
          'to come from the same version, or settings the panel offers will not be ' +
          'understood by the plugin. Replace both, then remove and re-import the ' +
          'plugin.</div>');
    }
    return;
  }
  if (m.type === "selection") {
    $("slotShot").className = "slot" + (m.shot ? "" : " empty");
    $("slotShot").innerHTML = m.shot ? "screenshot: <b>" + m.shot + "</b>" : "no screenshot selected";
    $("slotComp").className = "slot" + (m.comp ? "" : " empty");
    $("slotComp").innerHTML = m.comp ? "component: <b>" + m.comp + "</b>" : "no component selected";
    $("run").disabled = !(m.shot && m.comp);
  }
  if (m.type === "collected") {
    if (m.error) { log('<div class="bad">' + m.error + '</div>'); return; }
    // A responsive request that comes back without the flag means code.js did not
    // understand it, which means the two files are from different versions.
    if (m.device && $("dev").value === "responsive" && !m.device.responsive) {
      // Note it, but carry on: the panel knows the mode without being told.
      m.responsiveFallback = true;
    }
    try { await run(m); }
    catch (err) { log('<div class="bad">' + err.message + '</div>'); }
  }
  if (m.type === "resized") {
    log('<div class="note">' + m.note + '</div>');
  }
  if (m.type === "annotated") {
    log($("log").innerHTML + '<div class="note">' + m.note + '</div>');
  }
};
</script>
</body>
